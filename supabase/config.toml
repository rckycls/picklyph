project_id = "picklyph"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# Demo map markers are never database seeds.
enabled = false

[studio]
enabled = true
port = 54323

[analytics]
# The Windows per-user Docker engine does not expose the TCP logging endpoint.
enabled = false

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your PicklyPH sign-in code"
content_path = "./supabase/templates/email-code.html"

[auth.email.template.confirmation]
subject = "Your PicklyPH sign-in code"
content_path = "./supabase/templates/email-code.html"

[functions.venue-search]
# Guests are allowed; supplied bearer tokens are independently verified in code.
verify_jwt = false
# Hosted (API) bundling does not discover the shared map on its own; local serve and deploy use the same pins.
import_map = "./functions/deno.json"

[functions.owner-submissions]
# Signed-in owners only; every bearer token is verified in code with getUser.
verify_jwt = false
import_map = "./functions/deno.json"

[functions.owner-venues]
# Verified owners only; every bearer token is verified in code with getUser.
verify_jwt = false
import_map = "./functions/deno.json"

[functions.owner-schedules]
# Owners/admins only; every bearer is independently verified with getUser.
verify_jwt = false
import_map = "./functions/deno.json"
