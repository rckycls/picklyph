<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title description">
  <title id="title">Pickly Concept C color palette</title>
  <desc id="description">Court blue, ball yellow, court green, deep green, and line white from the user's Concept C brand board.</desc>
  <rect width="900" height="330" rx="24" fill="#F4F6FA"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#1E3F7C">
    <text x="32" y="48" font-size="26" font-weight="700">pickly</text>
    <text x="32" y="76" font-size="15" fill="#1B7A3C">Find a court. Run a court.</text>
    <g transform="translate(32 100)">
      <rect width="156" height="110" rx="14" fill="#1E3F7C"/>
      <text y="140" font-size="16" font-weight="600">Court blue</text>
      <text y="164" font-size="14" fill="#485468">#1E3F7C</text>
    </g>
    <g transform="translate(202 100)">
      <rect width="156" height="110" rx="14" fill="#D6F22E"/>
      <text y="140" font-size="16" font-weight="600">Ball yellow</text>
      <text y="164" font-size="14" fill="#485468">#D6F22E</text>
    </g>
    <g transform="translate(372 100)">
      <rect width="156" height="110" rx="14" fill="#2E9A4B"/>
      <text y="140" font-size="16" font-weight="600">Court green</text>
      <text y="164" font-size="14" fill="#485468">#2E9A4B</text>
    </g>
    <g transform="translate(542 100)">
      <rect width="156" height="110" rx="14" fill="#1B7A3C"/>
      <text y="140" font-size="16" font-weight="600">Deep green</text>
      <text y="164" font-size="14" fill="#485468">#1B7A3C</text>
    </g>
    <g transform="translate(712 100)">
      <rect width="156" height="110" rx="14" fill="#FFFFFF" stroke="#CFD9E8"/>
      <text y="140" font-size="16" font-weight="600">Line white</text>
      <text y="164" font-size="14" fill="#485468">#FFFFFF</text>
    </g>
    <text x="32" y="306" font-size="14" fill="#485468">Blue for primary actions · Yellow for selection · Deep green for status</text>
  </g>
</svg>
